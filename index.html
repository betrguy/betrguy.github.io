<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Intelligence Terminal</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --card: #11161d;
    --elevated: #161d26;
    --border: #1e293b;
    --border-hi: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --cyan: #22d3ee;
    --emerald: #10b981;
    --orange: #fb923c;
    --crimson: #f43f5e;
    --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 40px;
    padding: 5px 12px;
    background: var(--card);
    border-bottom: 1px solid rgba(34, 211, 238, 0.3);
    font-size: 12px;
  }
  .bar-grp {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.3px;
    border: 1px solid var(--border-hi);
    background: var(--elevated);
    color: var(--cyan);
  }
  .status-pill.live {
    color: var(--emerald);
    border-color: rgba(16, 185, 129, 0.55);
    background: rgba(16, 185, 129, 0.12);
  }
  .status-pill.offline {
    color: var(--orange);
    border-color: rgba(251, 146, 60, 0.55);
    background: rgba(251, 146, 60, 0.12);
  }
  .status-pill.error {
    color: var(--crimson);
    border-color: rgba(244, 63, 94, 0.55);
    background: rgba(244, 63, 94, 0.12);
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  select, input, button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-hi);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 12px;
    font-family: var(--mono);
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--cyan);
  }
  button {
    background: var(--elevated);
    cursor: pointer;
    font-family: var(--sans);
    font-weight: 600;
  }
  button:hover {
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .btn-accent {
    border-color: rgba(34, 211, 238, 0.5);
    color: var(--cyan);
  }
  .cfg-pop {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: #0d131a;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .cfg-pop.open { display: flex; flex-wrap: wrap; }
  .frame-wrap {
    flex: 1;
    position: relative;
    background: var(--bg);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: var(--bg);
  }
  .empty-state {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    padding: 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty-state.open { display: flex; }
  .sub { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="bar-grp">
      <span id="status-pill" class="status-pill"><span class="dot"></span><span id="status-text">CONNECTING...</span></span>
      <span id="snap-meta" class="sub"></span>
    </div>
    <div class="bar-grp">
      <label class="sub" for="ticker-select">Ticker</label>
      <select id="ticker-select" aria-label="Cached tickers"></select>
      <input id="ticker-input" type="text" placeholder="NVDA" maxlength="10" style="width:74px;text-transform:uppercase;" aria-label="Custom ticker">
      <select id="tf-select" aria-label="Timeframe">
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
        <option value="daily">Daily (0DTE)</option>
      </select>
      <button type="button" id="go-btn" class="btn-accent">Load</button>
      <button type="button" id="retry-btn">Retry Live</button>
      <button type="button" id="cfg-btn">Server</button>
    </div>
  </header>

  <div id="cfg-pop" class="cfg-pop">
    <span class="sub">Laptop / Tunnel URL:</span>
    <input id="backend-url-input" type="text" placeholder="https://terminal.yourdomain.com or http://127.0.0.1:5090" style="min-width:290px;flex:1;max-width:460px;">
    <button type="button" id="save-backend-btn" class="btn-accent">Save &amp; Connect</button>
    <button type="button" id="reset-backend-btn">Reset Localhost</button>
    <span class="sub">Saved privately in this browser's localStorage.</span>
  </div>

  <main class="frame-wrap">
    <iframe id="term-frame" title="Market Intelligence Terminal"></iframe>
    <div id="empty-state" class="empty-state">
      <b style="color:#22d3ee;font-size:15px;">Waiting for Live Laptop Server or Cached Snapshot</b>
      <div id="empty-detail" class="sub"></div>
    </div>
  </main>
</div>

<script>
(function () {
  var DEFAULT_LOCAL = "http://127.0.0.1:5090";
  var params = new URLSearchParams(window.location.search);
  if (params.get("backend")) {
    localStorage.setItem("mc_backend_url", params.get("backend").replace(/\/+$/, ""));
  }

  var state = {
    ticker: (params.get("ticker") || "NVDA").toUpperCase(),
    tf: (params.get("tf") || "weekly").toLowerCase(),
    backendUrl: (localStorage.getItem("mc_backend_url") || DEFAULT_LOCAL).replace(/\/+$/, ""),
    mode: "checking",
    manifest: { items: [] }
  };

  var statusPill = document.getElementById("status-pill");
  var statusText = document.getElementById("status-text");
  var snapMeta = document.getElementById("snap-meta");
  var tickerSelect = document.getElementById("ticker-select");
  var tickerInput = document.getElementById("ticker-input");
  var tfSelect = document.getElementById("tf-select");
  var frame = document.getElementById("term-frame");
  var emptyState = document.getElementById("empty-state");
  var emptyDetail = document.getElementById("empty-detail");
  var cfgPop = document.getElementById("cfg-pop");
  var backendInput = document.getElementById("backend-url-input");

  tickerInput.value = state.ticker;
  tfSelect.value = state.tf;
  backendInput.value = state.backendUrl;

  function setStatus(cls, text, meta) {
    statusPill.className = "status-pill " + cls;
    statusText.textContent = text;
    snapMeta.textContent = meta || "";
  }

  function populateTickerSelect() {
    var seen = {};
    var opts = [];
    (state.manifest.items || []).forEach(function (it) {
      if (!seen[it.ticker]) {
        seen[it.ticker] = it;
        opts.push(it.ticker);
      }
    });
    if (!seen[state.ticker]) opts.unshift(state.ticker);
    tickerSelect.innerHTML = "";
    opts.forEach(function (sym) {
      var op = document.createElement("option");
      op.value = sym;
      op.textContent = sym;
      if (sym === state.ticker) op.selected = true;
      tickerSelect.appendChild(op);
    });
  }

  async function loadManifest() {
    try {
      var res = await fetch("./snapshots/manifest.json?ts=" + Date.now(), { cache: "no-store" });
      if (res.ok) {
        state.manifest = await res.json();
      }
    } catch (_) {
      state.manifest = { items: [] };
    }
    populateTickerSelect();
  }

  async function checkBackendHealth() {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 2500);
    try {
      var res = await fetch(state.backendUrl + "/api/health", {
        mode: "cors",
        cache: "no-store",
        signal: ctrl.signal
      });
      clearTimeout(timer);
      if (!res.ok) return null;
      return await res.json();
    } catch (_) {
      clearTimeout(timer);
      return null;
    }
  }

  function findOfflineItem(sym, tf) {
    var items = state.manifest.items || [];
    return items.find(function (it) { return it.ticker === sym && it.timeframe === tf; })
      || items.find(function (it) { return it.ticker === sym; })
      || items.find(function (it) { return it.ticker === "NVDA"; })
      || items[0]
      || null;
  }

  function wireOfflineFrameLinks() {
    if (state.mode !== "offline") return;
    try {
      var doc = frame.contentDocument;
      if (!doc) return;
      doc.addEventListener("click", function (ev) {
        var a = ev.target && ev.target.closest ? ev.target.closest("a") : null;
        if (!a) return;
        var href = a.getAttribute("href") || "";
        if (href.startsWith("/?")) {
          ev.preventDefault();
          var q = new URLSearchParams(href.slice(2));
          state.ticker = (q.get("ticker") || state.ticker).toUpperCase();
          state.tf = (q.get("tf") || state.tf).toLowerCase();
          tickerInput.value = state.ticker;
          tfSelect.value = state.tf;
          populateTickerSelect();
          renderTarget();
        }
      });
    } catch (_) {}
  }

  frame.addEventListener("load", wireOfflineFrameLinks);

  async function renderTarget() {
    setStatus("", "CHECKING LAPTOP...", state.backendUrl);
    var health = await checkBackendHealth();
    if (health && health.ok) {
      state.mode = "live";
      emptyState.classList.remove("open");
      setStatus("live", "LIVE \u2022 LAPTOP CONNECTED", state.backendUrl + " (" + (health.snapshot_slot || "LIVE") + ")");
      frame.src = state.backendUrl + "/?ticker=" + encodeURIComponent(state.ticker) + "&tf=" + encodeURIComponent(state.tf);
      return;
    }

    state.mode = "offline";
    var item = findOfflineItem(state.ticker, state.tf);
    if (item && item.file_html) {
      emptyState.classList.remove("open");
      state.ticker = item.ticker;
      state.tf = item.timeframe || "weekly";
      tickerInput.value = state.ticker;
      tfSelect.value = state.tf;
      populateTickerSelect();
      setStatus(
        "offline",
        "OFFLINE \u2022 " + (item.snapshot_slot || "SNAPSHOT"),
        item.ticker + " (" + (item.session_date || "") + " \u2022 " + (item.fetched_at || "") + ")"
      );
      frame.src = "./" + item.file_html + "?ts=" + encodeURIComponent(item.fetched_at || "");
    } else {
      frame.removeAttribute("src");
      setStatus("error", "OFFLINE \u2022 NO SNAPSHOT", "No cached snapshot available");
      emptyDetail.textContent = "Start market_context.py on your laptop or push snapshots via --export-site.";
      emptyState.classList.add("open");
    }
  }

  tickerSelect.addEventListener("change", function () {
    state.ticker = tickerSelect.value.toUpperCase();
    tickerInput.value = state.ticker;
    renderTarget();
  });

  document.getElementById("go-btn").addEventListener("click", function () {
    var val = (tickerInput.value || state.ticker).trim().toUpperCase();
    if (val) state.ticker = val;
    state.tf = tfSelect.value;
    populateTickerSelect();
    renderTarget();
  });

  tickerInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("go-btn").click();
  });

  document.getElementById("retry-btn").addEventListener("click", renderTarget);
  document.getElementById("cfg-btn").addEventListener("click", function () {
    cfgPop.classList.toggle("open");
  });

  document.getElementById("save-backend-btn").addEventListener("click", function () {
    var raw = (backendInput.value || DEFAULT_LOCAL).trim().replace(/\/+$/, "");
    if (!raw) raw = DEFAULT_LOCAL;
    state.backendUrl = raw;
    localStorage.setItem("mc_backend_url", raw);
    cfgPop.classList.remove("open");
    renderTarget();
  });

  document.getElementById("reset-backend-btn").addEventListener("click", function () {
    state.backendUrl = DEFAULT_LOCAL;
    backendInput.value = DEFAULT_LOCAL;
    localStorage.setItem("mc_backend_url", DEFAULT_LOCAL);
    cfgPop.classList.remove("open");
    renderTarget();
  });

  loadManifest().then(renderTarget);
})();
</script>
</body>
</html>
